<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Test Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #232F3E, #FF9900);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            background: #28a745;
            border-radius: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            font-size: 0.9rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AWS Test Page</h1>
        <p>Your static website is running successfully.</p>
        <div class="status">✓ Deployment Successful</div>

        <footer>
            Hosted on AWS | Test Environment
        </footer>
    </div>
</body>
</html>
